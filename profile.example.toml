# Профиль для писем. Скопируйте в profile.toml и перепишите своим.
# Каждый блок это факт с цифрой. Блоки с тегами подбираются под вакансию,
# блок без тегов считается общим и может попасть в любое письмо.
#
# ВАЖНО: текст ниже это пример, а не готовое письмо. Пока в блоке остается
# слово ЗАМЕНИТЕ, hhjob letters не даст отправить отклик.

[profile]
name = "Имя Фамилия"
signature = "Имя Фамилия"
greeting = "Здравствуйте!"
question = "Подскажите, что для вас будет главным результатом первых 3 месяцев."

[[profile.why]]
tags = ["sales"]
text = """ЗАМЕНИТЕ: почему вам интересна эта компания и эта роль. Одно или два предложения по существу вакансии, без похвалы работодателю."""

[[profile.proof]]
tags = ["sales", "management"]
text = """ЗАМЕНИТЕ: факт про управление командой. Сколько человек, что именно построили, какая метрика изменилась."""

[[profile.proof]]
tags = ["sales"]
text = """ЗАМЕНИТЕ: факт про продажи. Цикл сделки, средний чек, сколько клиентов вели, какая выручка."""

[[profile.proof]]
tags = ["crm", "analytics"]
text = """ЗАМЕНИТЕ: факт про внедрение или аналитику. Какие системы, какие процессы, что стало измеримым."""

[[profile.gap]]
tags = ["management"]
text = """ЗАМЕНИТЕ: чего у вас нет по этой вакансии. Одно предложение, без оправданий."""

[[profile.gap]]
tags = ["crm"]
text = """ЗАМЕНИТЕ: какой технологии или опыта не хватает и как быстро это закрывается."""
