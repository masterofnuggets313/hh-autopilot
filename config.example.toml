# Конфигурация поиска. Скопируйте в config.toml и правьте под себя.
# В репозиторий config.toml не попадает: там id ваших резюме и личные фильтры.

area = 113            # 113 это Россия, 1 Москва, 2 Санкт-Петербург
schedule = "remote"   # remote, fullDay, shift, flexible
only_with_salary = true

# Каталог, где hh-applicant-tool хранит токен. По умолчанию .hh-config рядом.
# config_dir = "C:/Users/you/.hh"

[limits]
per_run = 10          # сколько откликов за один запуск
per_day = 40          # потолок в сутки, выше начинается капча
pause_seconds = 4.0

# Треки: отдельное резюме и свои запросы. id резюме видно в hhjob doctor.
[tracks.sales]
resume_id = "0000000000000000000000000000000000000000"
salary_from = 100000
queries = [
  "менеджер по продажам B2B удаленно",
  "аккаунт-менеджер удаленно",
  "руководитель отдела продаж удаленно",
]

[tracks.crm]
resume_id = "1111111111111111111111111111111111111111"
salary_from = 100000
queries = [
  "внедрение CRM удаленно",
  "бизнес-аналитик CRM удаленно",
  "руководитель техподдержки Битрикс24",
]

[tracks.seo]
resume_id = "2222222222222222222222222222222222222222"
salary_from = 90000
queries = [
  "SEO-специалист удаленно",
  "технический SEO удаленно",
]

# Темы. По ним считается оценка вакансии и подбираются блоки письма.
# Регулярные выражения, регистр не важен.
[tags]
sales = ["продаж", "аккаунт", "клиент", "B2B", "удержан", "допродаж"]
crm = ["CRM", "Битрикс24", "amoCRM", "внедрен", "интеграц", "автоматизац"]
support = ["поддержк", "SLA", "service desk", "helpdesk", "эскалац"]
analytics = ["аналитик", "метрик", "дашборд", "сквозн"]
seo = ["SEO", "поисков", "семантик", "ссылк", "индексац"]
management = ["руководител", "команд", "отдел", "управлен"]

# Признаки холодного поиска. Вакансия с ними отсеивается.
# Отрицание учитывается автоматически: «без холодных звонков» не блокер,
# а наоборот плюс, такие вакансии попадают в поле plus.
[filters]
# scope = "requirements" сужает поиск блокеров до блоков «Требования»
# и «Обязанности». По умолчанию проверяется весь текст: заголовки есть не всегда.
scope = "all"
cold = [
  "холодн\\w* (звон|поиск|баз)",
  "холодные звонки",
  "обзвон",
  "поиск (новых )?клиентов",
  "привлечени\\w* (новых )?клиент",
  "активн\\w* продаж",
  "лидогенерац",
]
gph = ["ГПХ", "гражданско-правов\\w*", "самозанят"]
